name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - .github/workflows/ci.yaml
      - "**/*.go"
      - cmd/**
      - docker-bake.hcl
      - Dockerfile
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths

permissions:
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -short -trimpath -timeout 10m ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # build 타깃: 크로스컴파일(amd64+arm64)로 바이너리를 ./output 에 낸다(단일 빌더 플랫폼).
      - name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: build
          set: |
            build.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # package 타깃: ./output 의 바이너리를 스크래치 이미지로 싸서 멀티아치로 push.
      - name: Push image
        uses: docker/bake-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          source: .
          targets: package
          set: |
            package.platform=linux/amd64
            package.platform=linux/arm64
            package.output=type=registry
